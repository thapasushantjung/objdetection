    <style>
        body {
            background-color: #0B0F19;
            color: #E5E7EB;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .gradient-border {
            position: relative;
            background: rgba(17, 24, 39, 0.8);
            background-clip: padding-box;
            border: 1px solid transparent;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, #00F0FF, #8A2BE2, #4A90E2);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #00F0FF;
            border-bottom: 2px solid #00F0FF;
        }

        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Input slider custom styles */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00F0FF;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px #00F0FF;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        #preview-img, #webcam-video {
            display: none;
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 0.5rem;
        }
        
        #results-canvas {
            max-width: 100%;
            max-height: 550px;
            object-fit: contain;
            border-radius: 0.5rem;
            width: 100%;
        }

        .loader {
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-radius: 50%;
            border-top: 3px solid #00F0FF;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen bg-mesh bg-fixed selection:bg-accent-cyan selection:text-dark-900 flex flex-col relative overflow-x-hidden">
