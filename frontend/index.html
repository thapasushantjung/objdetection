<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPE Shield AI - YOLOv8 Detection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // bounce em if they dont have a token
        if (!localStorage.getItem('auth_token')) {
            window.location.href = 'login.html';
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.05)',
                            200: 'rgba(255, 255, 255, 0.1)',
                            300: 'rgba(255, 255, 255, 0.15)',
                        },
                        dark: {
                            900: '#0B0F19',
                            800: '#111827',
                            700: '#1F2937'
                        },
                        accent: {
                            cyan: '#00F0FF',
                            purple: '#8A2BE2',
                            blue: '#4A90E2'
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'mesh': 'url("data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z\' fill=\'%23ffffff\' fill-opacity=\'0.03\' fill-rule=\'evenodd\'/%3E%3C/svg%3E")',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F19;
            color: #E5E7EB;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .gradient-border {
            position: relative;
            background: rgba(17, 24, 39, 0.8);
            background-clip: padding-box;
            border: 1px solid transparent;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, #00F0FF, #8A2BE2, #4A90E2);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #00F0FF;
            border-bottom: 2px solid #00F0FF;
        }

        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Input slider custom styles */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00F0FF;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px #00F0FF;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        #preview-img, #webcam-video {
            display: none;
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 0.5rem;
        }
        
        #results-canvas {
            max-width: 100%;
            max-height: 550px;
            object-fit: contain;
            border-radius: 0.5rem;
            width: 100%;
        }

        .loader {
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-radius: 50%;
            border-top: 3px solid #00F0FF;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen bg-mesh bg-fixed selection:bg-accent-cyan selection:text-dark-900 flex flex-col relative overflow-x-hidden">

    <!-- Background glow effects -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-accent-purple rounded-full mix-blend-screen filter blur-[128px] opacity-20 z-0 animate-pulse"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-accent-cyan rounded-full mix-blend-screen filter blur-[128px] opacity-20 z-0"></div>

    <div class="container mx-auto px-4 py-8 relative z-10 flex-1 flex flex-col">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8 glass-panel p-6 rounded-2xl">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl gradient-border flex items-center justify-center p-2 shadow-[0_0_15px_rgba(0,240,255,0.5)]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-accent-cyan via-accent-purple to-accent-blue tracking-tight">
                        PPE Shield AI
                    </h1>
                    <p class="text-gray-400 text-sm font-medium mt-1">YOLOv8-Powered PPE Compliance Monitor</p>
                </div>
            </div>
            <div class="hidden md:flex items-center space-x-2 text-xs font-semibold px-4 py-2 rounded-full glass-panel border-accent-cyan/30 text-accent-cyan shadow-[0_0_10px_rgba(0,240,255,0.2)]">
                <span class="w-2 h-2 rounded-full bg-accent-cyan animate-pulse mr-2"></span>
                System Online
            </div>
            <button onclick="logout()" class="ml-4 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/50 rounded-lg text-sm font-medium transition-colors">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
            </button>
        </header>

        <!-- Main Content -->
        <div class="flex flex-col lg:flex-row gap-8 flex-1">
            
            <!-- Left Panel: Input -->
            <div class="w-full lg:w-1/3 flex flex-col gap-6">
                
                <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fa-solid fa-layer-group mr-3 text-accent-purple"></i> Input Source
                    </h2>
                    
                    <!-- Tabs -->
                    <div class="flex bg-dark-800/50 rounded-lg p-1 mb-6 border border-white/5">
                        <button class="tab-btn flex-1 py-2 text-sm font-medium rounded-md transition-all duration-300 active" data-target="upload-tab">
                            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload
                        </button>
                        <button class="tab-btn flex-1 py-2 text-sm font-medium rounded-md transition-all duration-300 text-gray-400 hover:text-white" data-target="url-tab">
                            <i class="fa-solid fa-link mr-2"></i>URL
                        </button>
                        <button class="tab-btn flex-1 py-2 text-sm font-medium rounded-md transition-all duration-300 text-gray-400 hover:text-white" data-target="webcam-tab">
                            <i class="fa-solid fa-camera mr-2"></i>Webcam
                        </button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="flex-1 relative min-h-[250px]">
                        
                        <!-- Upload Tab -->
                        <div id="upload-tab" class="tab-content absolute inset-0 transition-opacity duration-300 opacity-100 z-10 flex flex-col">
                            <div id="drop-zone" class="flex-1 border-2 border-dashed border-gray-600 hover:border-accent-cyan rounded-xl bg-dark-800/30 flex flex-col items-center justify-center p-6 text-center transition-colors cursor-pointer group">
                                <i class="fa-solid fa-image text-4xl text-gray-500 mb-4 group-hover:text-accent-cyan transition-colors"></i>
                                <p class="text-sm text-gray-300 mb-2">Drag and drop an image here</p>
                                <p class="text-xs text-gray-500 mb-4">or click to browse files</p>
                                <span class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-sm font-medium border border-white/10 transition-colors">Select File</span>
                                <input type="file" id="file-input" class="hidden" accept="image/jpeg, image/png, image/webp">
                                
                                <img id="preview-img" alt="Preview" class="mt-4 shadow-lg">
                            </div>
                        </div>
                        
                        <!-- URL Tab -->
                        <div id="url-tab" class="tab-content absolute inset-0 transition-opacity duration-300 opacity-0 z-0 pointer-events-none flex flex-col">
                            <div class="bg-dark-800/50 p-4 rounded-xl border border-white/5 flex flex-col gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-2">Image URL</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="url-input" placeholder="https://example.com/image.jpg" class="flex-1 bg-dark-900 border border-gray-700 focus:border-accent-cyan focus:ring-1 focus:ring-accent-cyan rounded-lg px-4 py-2 text-sm outline-none transition-all placeholder-gray-600">
                                        <button id="load-url-btn" class="px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/10 rounded-lg text-sm font-medium transition-colors">Load</button>
                                    </div>
                                </div>
                                <div id="url-preview-container" class="flex-1 hidden border border-gray-700 rounded-lg overflow-hidden bg-dark-900 flex items-center justify-center p-2 min-h-[150px]">
                                    <img id="url-preview-img" class="max-w-full max-h-[180px] object-contain rounded">
                                </div>
                            </div>
                        </div>
                        
                        <!-- Webcam Tab -->
                        <div id="webcam-tab" class="tab-content absolute inset-0 transition-opacity duration-300 opacity-0 z-0 pointer-events-none flex flex-col">
                            <div class="flex-1 bg-dark-900 border border-gray-700 rounded-xl overflow-hidden relative flex flex-col items-center justify-center">
                                <video id="webcam-video" autoplay playsinline class="w-full h-full object-cover"></video>
                                <div id="webcam-placeholder" class="text-center p-6">
                                    <i class="fa-solid fa-video text-3xl text-gray-600 mb-3"></i>
                                    <p class="text-sm text-gray-400">Webcam inactive</p>
                                </div>
                            </div>
                            <div class="flex gap-3 mt-4">
                                <button id="start-webcam" class="flex-1 px-4 py-2 bg-accent-blue/20 hover:bg-accent-blue/30 text-accent-blue border border-accent-blue/50 rounded-lg text-sm font-medium transition-colors flex justify-center items-center">
                                    <i class="fa-solid fa-play mr-2"></i> Start
                                </button>
                                <button id="stop-webcam" class="flex-1 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/50 rounded-lg text-sm font-medium transition-colors flex justify-center items-center hidden">
                                    <i class="fa-solid fa-stop mr-2"></i> Stop
                                </button>
                                <button id="capture-webcam" class="flex-1 px-4 py-2 bg-accent-cyan/20 hover:bg-accent-cyan/30 text-accent-cyan border border-accent-cyan/50 rounded-lg text-sm font-medium transition-colors flex justify-center items-center hidden">
                                    <i class="fa-solid fa-camera mr-2"></i> Capture
                                </button>
                            </div>
                        </div>

                    </div>

                    <!-- Settings -->
                    <div class="mt-8">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-medium text-gray-300">Confidence Threshold</label>
                            <span id="conf-val" class="text-xs font-bold text-accent-cyan bg-accent-cyan/10 px-2 py-1 rounded">25%</span>
                        </div>
                        <input type="range" id="conf-slider" min="0.1" max="1.0" step="0.01" value="0.25" class="w-full">
                    </div>

                    <button id="run-btn" class="mt-6 w-full py-3 px-4 bg-gradient-to-r from-accent-cyan to-accent-blue hover:from-accent-blue hover:to-accent-purple text-white font-bold rounded-xl shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
                        <span>Run Detection</span>
                        <i class="fa-solid fa-bolt"></i>
                    </button>
                    <div id="error-msg" class="hidden mt-3 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg text-center"></div>
                </div>
            </div>

            <!-- Right Panel: Results -->
            <div class="w-full lg:w-2/3 flex flex-col gap-6">
                
                <!-- Canvas Area -->
                <div class="glass-panel rounded-2xl p-6 flex flex-col flex-1 min-h-[400px] relative gradient-border">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold flex items-center">
                            <i class="fa-solid fa-display mr-3 text-accent-blue"></i> Visual Analysis
                        </h2>
                        <div id="inference-status" class="text-xs font-medium px-3 py-1 bg-white/5 rounded-full border border-white/10 text-gray-400 flex items-center hidden">
                            <div class="loader mr-2 w-[14px] h-[14px] border-[2px]"></div> Processing...
                        </div>
                    </div>
                    
                    <div class="flex-1 bg-dark-900 rounded-xl border border-gray-700 overflow-hidden relative flex items-center justify-center checkerboard-bg" style="background-image: linear-gradient(45deg, #111827 25%, transparent 25%), linear-gradient(-45deg, #111827 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111827 75%), linear-gradient(-45deg, transparent 75%, #111827 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;">
                        <canvas id="results-canvas" class="z-10 shadow-2xl"></canvas>
                        <div id="canvas-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-0">
</div></div></div></body></html>
