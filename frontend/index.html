<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPE Shield AI - YOLOv8 Detection</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        // bounce em if they dont have a token
        if (!localStorage.getItem('auth_token')) {
            window.location.href = 'login.html';
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.05)',
                            200: 'rgba(255, 255, 255, 0.1)',
                            300: 'rgba(255, 255, 255, 0.15)',
                        },
                        dark: {
                            900: '#0B0F19',
                            800: '#111827',
                            700: '#1F2937'
                        },
                        accent: {
                            cyan: '#00F0FF',
                            purple: '#8A2BE2',
                            blue: '#4A90E2'
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'mesh': 'url("data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z\' fill=\'%23ffffff\' fill-opacity=\'0.03\' fill-rule=\'evenodd\'/%3E%3C/svg%3E")',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0F19;
            color: #E5E7EB;
        }
        
        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .gradient-border {
            position: relative;
            background: rgba(17, 24, 39, 0.8);
            background-clip: padding-box;
            border: 1px solid transparent;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px;
            border-radius: inherit;
            background: linear-gradient(135deg, #00F0FF, #8A2BE2, #4A90E2);
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #00F0FF;
            border-bottom: 2px solid #00F0FF;
        }

        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Input slider custom styles */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #00F0FF;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px #00F0FF;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        #preview-img, #webcam-video {
            display: none;
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 0.5rem;
        }
        
        #results-canvas {
            max-width: 100%;
            max-height: 550px;
            object-fit: contain;
            border-radius: 0.5rem;
            width: 100%;
        }

        .loader {
            border: 3px solid rgba(0, 240, 255, 0.2);
            border-radius: 50%;
            border-top: 3px solid #00F0FF;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen bg-mesh bg-fixed selection:bg-accent-cyan selection:text-dark-900 flex flex-col relative overflow-x-hidden">

    <!-- Background glow effects -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-accent-purple rounded-full mix-blend-screen filter blur-[128px] opacity-20 z-0 animate-pulse"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-accent-cyan rounded-full mix-blend-screen filter blur-[128px] opacity-20 z-0"></div>

    <div class="container mx-auto px-4 py-8 relative z-10 flex-1 flex flex-col">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8 glass-panel p-6 rounded-2xl">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 rounded-xl gradient-border flex items-center justify-center p-2 shadow-[0_0_15px_rgba(0,240,255,0.5)]">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-accent-cyan via-accent-purple to-accent-blue tracking-tight">
                        PPE Shield AI
                    </h1>
                    <p class="text-gray-400 text-sm font-medium mt-1">YOLOv8-Powered PPE Compliance Monitor</p>
                </div>
            </div>
            <div class="hidden md:flex items-center space-x-2 text-xs font-semibold px-4 py-2 rounded-full glass-panel border-accent-cyan/30 text-accent-cyan shadow-[0_0_10px_rgba(0,240,255,0.2)]">
                <span class="w-2 h-2 rounded-full bg-accent-cyan animate-pulse mr-2"></span>
                System Online
            </div>
            <button onclick="logout()" class="ml-4 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/50 rounded-lg text-sm font-medium transition-colors">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
            </button>
        </header>

        <!-- Main Content -->
        <div class="flex flex-col lg:flex-row gap-8 flex-1">
            
            <!-- Left Panel: Input -->
            <div class="w-full lg:w-1/3 flex flex-col gap-6">
                
                <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col">
                    <h2 class="text-xl font-semibold mb-6 flex items-center">
                        <i class="fa-solid fa-layer-group mr-3 text-accent-purple"></i> Input Source
                    </h2>
                    
                    <!-- Tabs -->
                    <div class="flex bg-dark-800/50 rounded-lg p-1 mb-6 border border-white/5">
                        <button class="tab-btn flex-1 py-2 text-sm font-medium rounded-md transition-all duration-300 active" data-target="upload-tab">
                            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>Upload
                        </button>
                        <button class="tab-btn flex-1 py-2 text-sm font-medium rounded-md transition-all duration-300 text-gray-400 hover:text-white" data-target="url-tab">
                            <i class="fa-solid fa-link mr-2"></i>URL
                        </button>
                        <button class="tab-btn flex-1 py-2 text-sm font-medium rounded-md transition-all duration-300 text-gray-400 hover:text-white" data-target="webcam-tab">
                            <i class="fa-solid fa-camera mr-2"></i>Webcam
                        </button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="flex-1 relative min-h-[250px]">
                        
                        <!-- Upload Tab -->
                        <div id="upload-tab" class="tab-content absolute inset-0 transition-opacity duration-300 opacity-100 z-10 flex flex-col">
                            <div id="drop-zone" class="flex-1 border-2 border-dashed border-gray-600 hover:border-accent-cyan rounded-xl bg-dark-800/30 flex flex-col items-center justify-center p-6 text-center transition-colors cursor-pointer group">
                                <i class="fa-solid fa-image text-4xl text-gray-500 mb-4 group-hover:text-accent-cyan transition-colors"></i>
                                <p class="text-sm text-gray-300 mb-2">Drag and drop an image here</p>
                                <p class="text-xs text-gray-500 mb-4">or click to browse files</p>
</div></div></div></div></body></html>
